[package]
name = "akayu"
version = "2.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "akayu"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["multiple-pymethods"] }
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
parking_lot = "0.12"
lock_api = "0.4"

[profile.release]
lto = "thin"
