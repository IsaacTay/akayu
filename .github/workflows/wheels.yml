# Builds akayu's wheels on each platform and runs the tests against each one
# there. Pushes to main and pull requests stop there (the wheels can be
# downloaded from the run's page for a week); a version tag (`just release`
# pushes one) also publishes them, with the sdist, as that version's GitHub
# release, then has the docs workflow list them in the package index that
# `uv add akayu --index akayu=https://isaactay.github.io/akayu/simple/` reads.
#
# Third-party actions are pinned to commits; the comments name their versions.
name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tag pushes, so a release always builds.
    paths-ignore: ["docs/**", "*.md", "mkdocs.yml"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch replaces its run; a release's run always finishes.
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheel:
    name: ${{ matrix.platform.name }} py${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux: zig links against glibc 2.17 symbols (manylinux2014), as `just wheels` does.
          - { name: linux-x86_64, runner: ubuntu-24.04, args: "--zig --compatibility manylinux_2_17" }
          # Cross-compiled on x86_64, as `just wheels` does, and tested by test-aarch64: a
          # native aarch64 build links its own build scripts with zig too, which fails.
          - name: linux-aarch64
            runner: ubuntu-24.04
            args: "--zig --compatibility manylinux_2_17 --target aarch64-unknown-linux-gnu"
            cross: true
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x64, runner: windows-2025 }
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The dev shell's uv, which the test script was checked with.
          version: "0.9.25"
          # No caches anywhere: a release's run must not reuse what another run left.
          enable-cache: false
      - name: Install zig (the dev shell's version)
        if: runner.os == 'Linux'
        run: python3 -m pip install ziglang==0.15.2
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # uv.lock's maturin, which `just build` uses.
          maturin-version: v1.11.5
          # The wheels dev shell's Rust (flake.lock), which `just wheels` uses. The
          # runner image's newer one (1.99) passes zig a linker flag it rejects.
          rust-toolchain: "1.97.1"
          # A cross build takes the interpreter's name, a native one the interpreter.
          args: >-
            --release --out dist ${{ matrix.platform.args }}
            -i ${{ matrix.platform.cross && format('python{0}', matrix.python) || steps.python.outputs.python-path }}
      # Before the tests, so a wheel that fails them can be downloaded and tried.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform.name }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Test
        if: ${{ !matrix.platform.cross }}
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/test-wheel.sh "$PYTHON" --benchmark-skip -m 'not slow'

  test-aarch64:
    name: linux-aarch64 py${{ matrix.python }} (test)
    needs: wheel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.25"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-aarch64-py${{ matrix.python }}
          path: dist
      - name: Test
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash scripts/test-wheel.sh "$PYTHON" --benchmark-skip -m 'not slow'

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, test-aarch64, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
      actions: write # start the docs workflow, which lists the new files in the index
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check the tag, the version and the files
        run: |
          version=$(awk -F '"' '/^version = / && !v {v = $2} END {print v}' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG doesn't match Cargo.toml's version $version"
              exit 1
          fi
          ls -l dist
          # 5 platforms x 2 Pythons, and the sdist.
          [ "$(find dist -name "akayu-$version-*.whl" | wc -l)" -eq 10 ]
          [ -f "dist/akayu-$version.tar.gz" ]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        run: |
          version=${TAG#v}
          # The notes: this version's section of CHANGELOG.md.
          awk -v heading="## $version" '$0 == heading {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          prerelease=()
          case $version in *[a-z]*) prerelease=(--prerelease) ;; esac
          # A draft first: once published, an immutable release takes no more files.
          gh release create "$TAG" dist/* --draft --verify-tag "${prerelease[@]}" \
              --title "akayu $version" --notes-file notes.md
          gh release edit "$TAG" --draft=false
      - name: Update the package index
        run: gh workflow run docs.yml --ref main
