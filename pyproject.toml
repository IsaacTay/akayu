[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "akayu"
authors = [
  { name="Isaac Tay", email="pypi.8yfi1@slmail.me" }
]
description = "Small fast stream processing library"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "B", "C4", "PERF", "RUF", "ARG", "PLC", "PLE", "PLW", "TCH", "FURB", "PTH", "SLOT", "FLY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLC0415", "PERF", "RUF001", "RUF002", "B017", "B007", "B011", "C414", "C417", "SIM"]
# Benchmark bodies: sinks that ignore their item, and streamz imported only by the runs that need it
"scripts/bench_complex.py" = ["ARG", "PLC0415", "B007", "SIM113"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after this long has hung: dump every thread's stack,
# so a deadlock shows where it waits instead of stalling the run silently.
faulthandler_timeout = 300
markers = [
    "slow: too slow for `just test-quick` (`-m 'not slow'` skips it)",
    "timing: measures CPU or wall time, so a heavily loaded machine can fail it (`-m 'not timing'`)",
]

[tool.maturin]
python-source = "python"
module-name = "akayu.akayu"

[tool.uv]
# Track Rust source files so uv rebuilds when they change
# See: https://github.com/PyO3/maturin/issues/2314
# pyproject.toml must be listed too: setting cache-keys replaces uv's default,
# so without it dependency changes leave stale metadata in the venv.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[dependency-groups]
dev = [
    "hypothesis>=6.113.0",
    "maturin>=1.10,<2.0",
    "mypy>=1.18",  # tests/test_stubs.py: mypy + stubtest check the type stub
    # numpy: tests/test_numpy_flows.py and tests/test_streamz_vs_akayu.py; scipy: tests kept outside the repository
    "numpy>=2.1",
    "psutil>=5.0",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-codeblocks>=0.17",
    "scipy>=1.14.1",
    "streamz>=0.6",
]
docs = [
    "mkdocs-shadcn>=0.9.8",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
    "mdformat-frontmatter>=2.0",
    "mdformat-admon>=2.0",
]
